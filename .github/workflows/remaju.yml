name: REMAJU Bloomberg - Scraper automático

on:
  schedule:
    # Cada 6 horas. Con el checkpoint ya sembrado, una corrida
    # incremental tarda ~18 min (medido en la corrida real del
    # 20/08/2026). A ese ritmo: 4 corridas/día × 18 min × 30 días ≈
    # 2,160 min/mes -dentro del cupo gratis de 2,000 min/mes con
    # margen razonable-. Si en el futuro las corridas empiezan a durar
    # más (por más remates o más lentitud de REMAJU), hay que volver a
    # ajustar esta cuenta.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # permite lanzarlo manualmente desde la pestaña "Actions"

# Si una corrida tarda más de lo previsto y ya está por empezar la
# siguiente, esto evita que dos corridas se pisen escribiendo el mismo
# checkpoint.
concurrency:
  group: remaju-scraper
  cancel-in-progress: false

permissions:
  contents: write   # necesario para que el workflow pueda guardar el checkpoint de vuelta en el repo

jobs:
  scrapear:
    runs-on: ubuntu-latest
    # Con margen real de sobra sobre los ~100 min que tarda un barrido
    # completo (el límite gratuito de GitHub por job es 360 min = 6h).
    timeout-minutes: 240

    steps:
      - name: Descargar el repositorio (incluye el checkpoint de la corrida anterior)
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del sistema (OCR y lectura de PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa poppler-utils

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Instalar navegador Chromium para Playwright
        run: playwright install --with-deps chromium

      - name: Correr el scraper (modo headless)
        env:
          REMAJU_HEADLESS: "true"
          PYTHONUNBUFFERED: "1"
        run: python remaju_scraper_v3.py

      - name: Dejar una copia fija del último Excel (evita acumular un archivo nuevo cada 30 min)
        run: |
          ultimo=$(ls -t Bloomberg_Remates_*.xlsx 2>/dev/null | head -n 1)
          if [ -n "$ultimo" ]; then
            cp "$ultimo" Bloomberg_Remates_ULTIMO.xlsx
            echo "Copiado $ultimo -> Bloomberg_Remates_ULTIMO.xlsx"
          else
            echo "No se generó ningún Excel nuevo en esta corrida."
          fi

      - name: Subir a Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python subir_a_sheets.py

      - name: Regenerar el dashboard (Remaju Ledger) con los datos de esta corrida
        run: python build_dashboard.py

      - name: Guardar checkpoint, último Excel y dashboard de vuelta en el repositorio
        run: |
          git config user.name "remaju-bot"
          git config user.email "actions@github.com"
          git add checkpoint_remaju.jsonl Bloomberg_Remates_ULTIMO.xlsx docs/index.html 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Actualización automática REMAJU $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Publicar el dashboard en Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_REMAJU }}"
          projectId: timewarp-messenger
          target: remaju-ledger
          channelId: live
